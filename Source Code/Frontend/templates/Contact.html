<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - AI PDF Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://unpkg.com/@barba/core"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">AI PDF Assistant</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}" {% if active_page == 'home' %}class="active"{% endif %}>Home</a></li>
            <li><a href="{{ url_for('trybot') }}" {% if active_page == 'trybot' %}class="active"{% endif %}>TryBot</a></li>
            <li><a href="{{ url_for('about') }}" {% if active_page == 'about' %}class="active"{% endif %}>About</a></li>
            <li><a href="{{ url_for('projects') }}" {% if active_page == 'projects' %}class="active"{% endif %}>Projects</a></li>
            <li><a href="{{ url_for('contact') }}" {% if active_page == 'contact' %}class="active"{% endif %}>Contact</a></li>
        </ul>
    </nav>

    <div data-barba="wrapper">
        <div data-barba="container" class="page-content">
            <div class="container">
                <div class="contact-hero">
                    <h1>Get in Touch</h1>
                    <p class="hero-subtitle">We'd love to hear from you</p>
                </div>

                <div class="contact-container">
                    <div class="contact-info">
                        <div class="info-card">
                            <div class="info-icon">📍</div>
                            <h3>Location</h3>
                            <p>narasaraopet, andhrapradesh</p>
                        </div>
                        <div class="info-card">
                            <div class="info-icon">📧</div>
                            <h3>Email</h3>
                            <p>satishduddu29@gmail.com</p>
                        </div>
                        <div class="info-card">
                            <div class="info-icon">☎️</div>
                            <h3>Phone</h3>
                            <p>+917680048961</p>
                        </div>

                        <!-- Social Profiles -->
                        <div class="info-card">
                            <div class="info-icon">🔗</div>
                            <h3>Social</h3>
                            <p style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                                <a href="https://github.com/your-username" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="social-link" style="color:inherit; text-decoration:none;">
                                    <i class="fab fa-github" style="font-size:1.2rem; margin-right:6px;"></i>GitHub
                                </a>
                                <a href="https://www.linkedin.com/in/your-profile" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="social-link" style="color:inherit; text-decoration:none;">
                                    <i class="fab fa-linkedin" style="font-size:1.2rem; margin-right:6px;"></i>LinkedIn
                                </a>
                            </p>
                        </div>
                    </div>

                    <div class="contact-form">
                        <form id="contactForm">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" required placeholder="Enter your name">
                            </div>
                            
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" required placeholder="Enter your email">
                            </div>

                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <input type="text" id="subject" required placeholder="What's this about?">
                            </div>

                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea id="message" rows="5" required placeholder="Your message here..."></textarea>
                            </div>

                            <button type="submit" class="submit-btn">
                                <span>Send Message</span>
                                <div class="button-icon">→</div>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 AI PDF Assistant. All rights reserved.</p>
    </footer>

    <div class="page-transition"></div>
    <script src="https://unpkg.com/@barba/core"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='transitions.js') }}"></script>
    <script>
      // Ensure mobile menu and other scripts from your other templates still work
      const menuToggle = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');
      const navbar = document.querySelector('.navbar');
      if (menuToggle) {
        menuToggle.addEventListener('click', () => {
          menuToggle.classList.toggle('active');
          navLinks.classList.toggle('active');
          navbar.style.background = navLinks.classList.contains('active') 
            ? 'rgba(20, 20, 20, 0.98)' 
            : 'rgba(30, 30, 30, 0.9)';
        });
      }
    </script>
</body>
</html>
